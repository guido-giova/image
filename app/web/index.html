<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111317">
    <title>Local Media Gallery</title>
    <link rel="stylesheet" href="/static/gallery.css">
    <script src="/static/gallery.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Gallery</h1>
        <p id="media-count" class="media-count" aria-live="polite">Loading library…</p>
      </header>

      <section class="gallery-controls" aria-label="Gallery controls">
        <div class="control control-search">
          <label for="search">Search</label>
          <input type="text" id="search" name="search" placeholder="Search by filename…">
        </div>

        <div class="control">
          <label for="amount-per-row">Per row</label>
          <input type="range" id="amount-per-row" name="amount-per-row" min="3" max="10">
          <output id="amount-per-row-value" class="range-value" for="amount-per-row">5</output>
        </div>

        <button id="filters-button" type="button">Filters</button>
        <button id="reload-button" type="button">Reload</button>
      </section>

      <section id="gallery-container">
        <p id="gallery-status" class="gallery-status" role="status" aria-live="polite">
          Looking for media in <code>_files</code>…
        </p>
        <section id="gallery" class="gallery" aria-label="Images and videos"></section>
      </section>
    </main>
    <dialog id="media-dialog" class="media-dialog" aria-labelledby="viewer-title">
      <div class="viewer">
        <div class="viewer-content">
          <div id="viewer-stage" class="viewer-stage"></div>
          <aside class="viewer-details" aria-label="Media details">
            <div class="viewer-controls">
              <button id="viewer-delete" class="viewer-control" type="button" aria-label="Delete file">
                <span aria-hidden="true">del</span>
              </button>
              <button id="viewer-favorite" class="viewer-control" type="button" aria-label="Favorite file">
                <span aria-hidden="true">fav</span>
              </button>
              <button id="viewer-save" class="viewer-control" type="button" aria-label="Save changes" disabled>
                <span aria-hidden="true">sav</span>
              </button>
              <button id="viewer-close" class="viewer-close" type="button" aria-label="Close media viewer">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <dl id="viewer-data" class="viewer-data"></dl>
          </aside>
        </div>
        <nav class="viewer-carousel" aria-label="Media carousel">
          <button id="viewer-previous" class="carousel-control" type="button" aria-label="Previous media">
            <span aria-hidden="true">&lsaquo;</span>
          </button>
          <div id="viewer-thumbnails" class="viewer-thumbnails"></div>
          <button id="viewer-next" class="carousel-control" type="button" aria-label="Next media">
            <span aria-hidden="true">&rsaquo;</span>
          </button>
        </nav>
      </div>
    </dialog>
  </body>
</html>
